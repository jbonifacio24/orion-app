name: motohub

description: MotoHub multiplatform foundation.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http_parser: ^4.1.2
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  equatable: ^2.0.7
  file_picker: ^10.3.10
  flutter_bloc: ^8.1.6
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.0.17
  get_it: ^8.0.3
  geolocator: ^14.0.2
  go_router: ^15.1.2
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  signalr_netcore: ^1.4.4
  url_launcher: ^6.3.1
  image_picker: 1.1.2
  record: 6.1.2
  video_player: ^2.14.1
  video_player_win: ^3.3.1
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  geocoding: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.15
  flutter_lints: ^5.0.0
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/motohub_logo.svg
    - assets/videos/
